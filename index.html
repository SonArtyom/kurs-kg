<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <title>Converter</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="top-row">
          <h1>Converter</h1>
          <div class="top-actions">
            <button id="lang" class="lang-btn" type="button">EN</button>
            <button id="edit" class="link-btn" type="button">Edit</button>
          </div>
        </div>
        <button id="status" class="status" type="button" aria-live="polite">
          <span class="dot"></span><span class="status-text">Loading…</span>
        </button>
      </header>
      <main id="list" class="list"></main>
      <footer id="pad" class="pad"></footer>
    </div>
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop"></div>
      <section class="sheet-body" role="dialog" id="sheet-body" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title">Add currency</h2>
          <button id="sheet-close" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>
        <input id="search" class="search" type="search" placeholder="Search: code or name" autocomplete="off" />
        <ul id="picker" class="picker"></ul>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
